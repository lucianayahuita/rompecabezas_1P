<meta charset="utf-8">
<title>Acceso Rompecabezas UCB</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
  :root{
    --purple-950:#150822;
    --purple-900:#1E0B3B;
    --purple-850:#26103F;
    --purple-800:#3B0764;
    --purple-700:#4C1D95;
    --purple-600:#6B21A8;
    --purple-500:#7E22CE;
    --purple-300:#D8B4FE;
    --amber-400:#FFC72C;
    --amber-300:#FFDE8A;
    --white:#FFFFFF;
    --ink:#2A0F4A;
    --glass:rgba(255,255,255,.09);
    --glass-strong:rgba(255,255,255,.15);
    --stroke:rgba(255,255,255,.22);
    --stroke-soft:rgba(255,255,255,.12);
    --text-dim:rgba(255,255,255,.62);
    --text-faint:rgba(255,255,255,.4);
    --stage-bg:#0A0710;
    --font-display:'Baloo 2', ui-rounded, system-ui, sans-serif;
    --font-body:'Plus Jakarta Sans', system-ui, sans-serif;
  }

  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--stage-bg);
    color:var(--white);
    font-family:var(--font-body);
    -webkit-font-smoothing:antialiased;
  }

  .stage{
    min-height:100dvh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:16px;
    position:relative;
    overflow:hidden;
  }
  .stage::before{
    content:"";
    position:absolute;
    inset:-20%;
    background:
      radial-gradient(60% 50% at 22% 15%, rgba(126,34,206,.35), transparent 60%),
      radial-gradient(55% 45% at 82% 85%, rgba(255,199,44,.14), transparent 60%);
    filter:blur(40px);
    pointer-events:none;
  }

  .device{
    position:relative;
    width:100%;
    max-width:412px;
    min-height:100dvh;
    background:
      radial-gradient(120% 65% at 50% -8%, var(--purple-500) 0%, var(--purple-800) 46%, var(--purple-950) 100%);
    overflow:hidden;
    display:flex;
    flex-direction:column;
    isolation:isolate;
  }

  .statusbar{
    display:none;
    align-items:center;
    justify-content:space-between;
    padding:14px 28px 0;
    font-family:var(--font-body);
    font-weight:700;
    font-size:14px;
    letter-spacing:.02em;
    color:var(--white);
  }
  .statusbar .icons{display:flex;gap:6px;align-items:center;opacity:.9;}

  .notch{
    display:none;
    position:absolute;
    top:0; left:50%;
    transform:translateX(-50%);
    width:120px; height:26px;
    background:#050308;
    border-radius:0 0 16px 16px;
    z-index:5;
  }

  /* --- decoración flotante --- */
  .deco{
    position:absolute;
    inset:0;
    pointer-events:none;
    z-index:0;
  }
  .deco span{
    position:absolute;
    opacity:.16;
    filter:saturate(1.1);
  }
  .piece{ font-size:30px; animation:float 7s ease-in-out infinite; }
  .spark{ font-size:13px; color:var(--amber-400); opacity:.55; animation:twinkle 2.6s ease-in-out infinite; }
  @keyframes float{
    0%,100%{ transform:rotate(var(--r,0deg)) translateY(0); }
    50%{ transform:rotate(calc(var(--r,0deg) + 6deg)) translateY(-8px); }
  }
  @keyframes twinkle{
    0%,100%{ opacity:.15; transform:scale(.85); }
    50%{ opacity:.75; transform:scale(1.05); }
  }

  .content{
    position:relative;
    z-index:1;
    flex:1;
    display:flex;
    flex-direction:column;
    padding:34px 26px 28px;
  }

  .brand{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:10px;
    margin-bottom:22px;
  }
  .brand-badge{
    position:relative;
    width:104px; height:104px;
    display:flex; align-items:center; justify-content:center;
  }
  .brand-badge::before{
    content:"";
    position:absolute; inset:-18px;
    background:radial-gradient(circle, rgba(255,199,44,.5), transparent 70%);
    filter:blur(6px);
    animation:glow 2.4s ease-in-out infinite;
  }
  @keyframes glow{
    0%,100%{ opacity:.55; transform:scale(.94); }
    50%{ opacity:1; transform:scale(1.04); }
  }
  .brand-badge img{
    position:relative;
    width:100%; height:100%;
    object-fit:contain;
    filter:drop-shadow(0 10px 18px rgba(0,0,0,.45));
  }
  .brand h1{
    font-family:var(--font-display);
    font-weight:800;
    font-size:15px;
    letter-spacing:.06em;
    text-transform:uppercase;
    margin:0;
    color:var(--text-dim);
  }
  .brand h1 b{ color:var(--amber-400); font-weight:800; }

  /* --- switch --- */
  .switcher{
    position:relative;
    display:grid;
    grid-template-columns:1fr 1fr;
    background:var(--glass);
    border:1px solid var(--stroke-soft);
    border-radius:999px;
    padding:4px;
    margin-bottom:22px;
    backdrop-filter:blur(6px);
  }
  .switcher input{
    position:absolute;
    opacity:0;
    pointer-events:none;
  }
  .switcher label{
    position:relative;
    z-index:2;
    text-align:center;
    padding:11px 8px;
    font-family:var(--font-body);
    font-weight:700;
    font-size:13.5px;
    color:var(--text-dim);
    border-radius:999px;
    cursor:pointer;
    transition:color .35s ease;
    user-select:none;
  }
  .switcher input:checked + label{ color:var(--ink); }
  .switcher input:focus-visible + label{ outline:2px solid var(--amber-400); outline-offset:2px; }
  .thumb{
    position:absolute;
    top:4px; bottom:4px; left:4px;
    width:calc(50% - 4px);
    border-radius:999px;
    background:linear-gradient(135deg, var(--amber-300), var(--amber-400));
    box-shadow:0 6px 16px rgba(255,199,44,.35);
    transition:transform .38s cubic-bezier(.65,0,.35,1);
    z-index:1;
  }
  #mode-register:checked ~ .thumb{ transform:translateX(100%); }

  /* --- formulario --- */
  .panel{
    background:var(--glass);
    border:1px solid var(--stroke-soft);
    border-radius:26px;
    padding:22px 20px 24px;
    backdrop-filter:blur(10px);
    box-shadow:0 20px 45px -18px rgba(0,0,0,.5);
  }
  .panel h2{
    font-family:var(--font-display);
    font-weight:700;
    font-size:21px;
    margin:0 0 4px;
  }
  .panel p.sub{
    margin:0 0 20px;
    font-size:13px;
    color:var(--text-dim);
  }

  form{ display:flex; flex-direction:column; gap:14px; }

  .field label{
    display:block;
    font-size:12.5px;
    font-weight:700;
    color:var(--text-dim);
    letter-spacing:.02em;
    margin-bottom:6px;
  }
  .field .box{
    position:relative;
    display:flex;
    align-items:center;
  }
  .field input{
    width:100%;
    background:rgba(255,255,255,.06);
    border:1.5px solid var(--stroke-soft);
    border-radius:14px;
    padding:13px 14px;
    color:var(--white);
    font-family:var(--font-body);
    font-size:14.5px;
    font-weight:500;
    outline:none;
    transition:border-color .2s ease, background .2s ease;
  }
  .field input::placeholder{ color:var(--text-faint); font-weight:400; }
  .field input:focus{
    border-color:var(--amber-400);
    background:rgba(255,255,255,.1);
  }
  .field input:focus-visible{ outline:2px solid var(--amber-400); outline-offset:1px; }
  .field.pw input{ padding-right:44px; }
  .eye{
    position:absolute;
    right:6px;
    display:flex;
    align-items:center;
    justify-content:center;
    width:34px; height:34px;
    background:transparent;
    border:none;
    color:var(--text-dim);
    cursor:pointer;
    border-radius:10px;
  }
  .eye:hover{ color:var(--amber-400); }
  .eye:focus-visible{ outline:2px solid var(--amber-400); }
  .eye svg{ width:19px; height:19px; }
  .hint{ font-size:11.5px; color:var(--text-faint); margin-top:5px; }

  /* campos extra (registro) con expansión suave */
  .extra{
    display:grid;
    grid-template-rows:0fr;
    transition:grid-template-rows .45s cubic-bezier(.65,0,.35,1);
  }
  .extra > div{ overflow:hidden; display:flex; flex-direction:column; gap:14px; }
  .extra .inner-pad{ padding-top:1px; }
  body[data-mode="register"] .extra{ grid-template-rows:1fr; }

  .cta{
    margin-top:6px;
    width:100%;
    border:none;
    border-radius:16px;
    padding:15px;
    font-family:var(--font-body);
    font-weight:800;
    font-size:15px;
    letter-spacing:.01em;
    color:var(--ink);
    background:linear-gradient(135deg, var(--amber-300), var(--amber-400));
    box-shadow:0 14px 28px -10px rgba(255,199,44,.55);
    cursor:pointer;
    transition:transform .18s ease, box-shadow .18s ease;
  }
  .cta:hover{ transform:translateY(-1px); box-shadow:0 18px 32px -10px rgba(255,199,44,.65); }
  .cta:active{ transform:translateY(0); }
  .cta:focus-visible{ outline:2px solid var(--white); outline-offset:2px; }

  .tagline{
    text-align:center;
    margin-top:22px;
    font-size:12.5px;
    color:var(--text-faint);
    letter-spacing:.04em;
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation:none !important; transition:none !important; }
  }

  @media (min-width:680px){
    .stage{ padding:56px 24px; }
    .device{
      min-height:860px;
      border-radius:46px;
      box-shadow:
        0 40px 90px -24px rgba(0,0,0,.65),
        0 0 0 10px #0c0714,
        0 0 0 11px rgba(255,255,255,.07);
    }
    .notch{ display:block; }
    .statusbar{ display:flex; }
    .content{ padding-top:20px; }
  }
</style>

<div class="stage">
  <div class="device">
    <div class="notch"></div>
    <div class="statusbar">
      <span>9:41</span>
      <span class="icons">
        <svg width="16" height="11" viewBox="0 0 16 11" fill="none"><rect x="0" y="6" width="3" height="5" rx="1" fill="#fff"/><rect x="4.5" y="4" width="3" height="7" rx="1" fill="#fff"/><rect x="9" y="2" width="3" height="9" rx="1" fill="#fff"/><rect x="13.5" y="0" width="2.5" height="11" rx="1" fill="#fff" fill-opacity=".5"/></svg>
        <svg width="22" height="11" viewBox="0 0 22 11" fill="none"><rect x=".5" y=".5" width="19" height="10" rx="2.5" stroke="#fff"/><rect x="2" y="2" width="16" height="7" rx="1.3" fill="#fff"/><rect x="20.5" y="3.5" width="1.5" height="4" rx=".7" fill="#fff"/></svg>
      </span>
    </div>

    <div class="deco" aria-hidden="true">
      <span class="piece" style="--r:-8deg; top:9%; left:8%;">🧩</span>
      <span class="piece" style="--r:12deg; top:16%; right:9%; animation-delay:1.2s;">🧩</span>
      <span class="piece" style="--r:-14deg; bottom:10%; left:6%; animation-delay:.6s;">🧩</span>
      <span class="piece" style="--r:10deg; bottom:16%; right:8%; animation-delay:1.8s;">🧩</span>
      <span class="spark" style="top:24%; left:20%; animation-delay:.3s;">✦</span>
      <span class="spark" style="top:30%; right:16%; animation-delay:1.1s;">✦</span>
      <span class="spark" style="bottom:30%; left:14%; animation-delay:1.6s;">✦</span>
      <span class="spark" style="bottom:26%; right:20%; animation-delay:.8s;">✦</span>
    </div>

    <div class="content">
      <div class="brand">
        <div class="brand-badge">
          <img src="logo.png" alt="Rompecabezas UCB">
        </div>
        <h1>Arma <b>·</b> Compite <b>·</b> Gana</h1>
      </div>

      <div class="switcher">
        <input type="radio" name="mode" id="mode-login" checked>
        <label for="mode-login" onclick="setMode('login')">Iniciar sesión</label>
        <input type="radio" name="mode" id="mode-register">
        <label for="mode-register" onclick="setMode('register')">Crear cuenta</label>
        <div class="thumb"></div>
      </div>

      <div class="panel">
        <h2 id="panel-title">Bienvenido de nuevo</h2>
        <p class="sub" id="panel-sub">Ingresa tus datos para seguir armando rompecabezas.</p>

        <form id="auth-form" autocomplete="off" onsubmit="return false;">
          <div class="extra">
            <div>
              <div class="inner-pad">
                <div class="field">
                  <label for="username">Nombre de usuario</label>
                  <div class="box">
                    <input id="username" type="text" placeholder="Ej. juanp_ucb" tabindex="-1">
                  </div>
                </div>
              </div>
            </div>
          </div>

          <div class="field">
            <label for="email">Correo electrónico</label>
            <div class="box">
              <input id="email" type="email" placeholder="tu.correo@ucb.edu.bo">
            </div>
          </div>

          <div class="field pw">
            <label for="password">Contraseña</label>
            <div class="box">
              <input id="password" type="password" placeholder="Mínimo 6 caracteres">
              <button type="button" class="eye" data-target="password" aria-label="Mostrar contraseña" onclick="toggleEye(this)">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"/><circle cx="12" cy="12" r="3"/></svg>
              </button>
            </div>
          </div>

          <div class="extra">
            <div>
              <div class="inner-pad" style="display:flex; flex-direction:column; gap:14px;">
                <div class="field pw">
                  <label for="confirm">Confirmar contraseña</label>
                  <div class="box">
                    <input id="confirm" type="password" placeholder="Repite tu contraseña" tabindex="-1">
                    <button type="button" class="eye" data-target="confirm" aria-label="Mostrar contraseña" onclick="toggleEye(this)">
                      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"/><circle cx="12" cy="12" r="3"/></svg>
                    </button>
                  </div>
                  <p class="hint">Usa letras, números y al menos un símbolo.</p>
                </div>
              </div>
            </div>
          </div>

          <button type="submit" class="cta" id="cta-btn" onclick="submitDemo()">Ingresar</button>
        </form>
      </div>

      <p class="tagline">PuzleUCB · Rompecabezas UCB</p>
    </div>
  </div>
</div>

<script>
  function setMode(mode){
    document.body.dataset.mode = mode;
    const isRegister = mode === 'register';

    document.getElementById('panel-title').textContent = isRegister
      ? 'Crea tu cuenta'
      : 'Bienvenido de nuevo';
    document.getElementById('panel-sub').textContent = isRegister
      ? 'Sumate a PuzleUCB y empezá a armar, competir y ganar.'
      : 'Ingresa tus datos para seguir armando rompecabezas.';
    document.getElementById('cta-btn').textContent = isRegister ? 'Crear cuenta' : 'Ingresar';

    document.getElementById('username').tabIndex = isRegister ? 0 : -1;
    document.getElementById('confirm').tabIndex = isRegister ? 0 : -1;
  }

  function toggleEye(btn){
    const input = document.getElementById(btn.dataset.target);
    const showing = input.type === 'text';
    input.type = showing ? 'password' : 'text';
    btn.setAttribute('aria-label', showing ? 'Mostrar contraseña' : 'Ocultar contraseña');
    btn.innerHTML = showing
      ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"/><circle cx="12" cy="12" r="3"/></svg>'
      : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a21.6 21.6 0 0 1 5.06-6.06M9.9 4.24A10.4 10.4 0 0 1 12 4c7 0 11 8 11 8a21.6 21.6 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>';
  }

  function submitDemo(){
    const mode = document.body.dataset.mode || 'login';
    alert(mode === 'register'
      ? 'Demo de diseño: acá se crearía la cuenta y se guardaría en la base local.'
      : 'Demo de diseño: acá se validarían las credenciales contra la base local.');
  }

  setMode('login');
</script>
